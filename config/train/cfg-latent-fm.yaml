# Entry: train/cfg_diffusion_train.py
# Learning baseline: 8-layer, width-256 DiT; frozen SDXL VAE. See config/README.md.
# RTX PRO 6000 Blackwell 96GB: batch_size 128; RTX 5090 32GB: start with --batch-size 32.
# Batch sizes are conservative starting points, not measured memory guarantees.
use_latent: true  # 入口开关：true 使用冻结 VAE + DiT；false 使用 UNet
image_size: 256  # RGB 图像边长；DiT.image_size 由此除以 VAE 下采样倍数得到 (H, W)
vae_model_name_or_path: stabilityai/sdxl-vae  # LatentDiffusion.from_pretrained_vae 同名参数：VAE 仓库 ID 或本地目录
vae_slicing: true  # 调用 vae.enable_slicing()，按 batch 逐张编解码以节省显存
d_model: 256  # DiT.d_model：Transformer 隐藏维度
num_layers: 8  # DiT.num_layers：Transformer block 数量
patch_size: 2  # DiT.patch_size：latent 上的 patch 边长，不是 RGB 像素
d_time_emb: 256  # DiT.d_time_emb：时间步正弦嵌入维度，须为偶数
num_heads: 8  # 模型 attention head 数；DiT 的 d_model / num_heads 须能被 4 整除
d_feature: 512  # 文本特征维度；传给 DiT.d_feature 或 CFGUNet.feature_channel，须匹配 CLIP
dataset_type: imagenet  # 入口选择的图像 loader：cifar10 或 imagenet
dataset: clane9/imagenet-100  # 传给 loader 的 repo_name：数据集仓库 ID
dataset_split: train  # 传给 loader 的 split；训练通常用 train
sample_posterior: true  # VAE posterior：true 采样 mu + std * noise；false 使用 mu
method: fm  # 训练算法选择：ddpm 预测噪声，fm 预测速度
epoches: 100  # TrainerConfig.epoches：目标总训练轮数（沿用现有代码的拼写）
batch_size: 128  # TrainerConfig / DataLoader.batch_size：每次更新的样本数
lr: 0.0001  # AdamW.lr：学习率
dropout: 0.0  # UNet.dropout；当前 DiT 不使用此参数，latent 配置设为 0
weight_decay: 0.0  # AdamW.weight_decay：权重衰减
step: 0.02  # FMSampler / CFGFMSampler.step：采样积分步长；不离散化训练时间
solver: euler  # FM sampler.solver：目前支持 euler
text_model_name: openai/clip-vit-base-patch32  # 文本编码器仓库 ID 或本地目录；CLIP 在 CPU 上运行
label_drop_rate: 0.1  # CFG dataset.label_drop_rate：用空文本替换类别提示的概率
train_max_length: 32  # 训练 dataset.max_length：文本 token 长度，含 BOS/EOS
eval_max_length: 32  # CFG sampler.eval_max_length：采样文本 token 长度
guidance_scale: 3.0  # CFG sampler.guidance_scale：0 无条件、1 纯条件、>1 增强条件引导
num_workers: 4  # DataLoader.num_workers：数据加载子进程数
cache_dir: ../../.cache/huggingface/datasets  # dataset.cache_dir：HF 数据缓存路径，相对本 YAML
save_dir: ../../checkpoints/imagenet100-cfg-latent-fm  # TrainerConfig.save_dir：checkpoint 目录，相对本 YAML
save_interval_epoch: 10  # TrainerConfig.save_interval_epoch：每隔多少轮保存并按需记录采样
resume: false  # TrainerConfig.resume：从 save_dir 中最新 checkpoint 继续训练
use_ema: true  # TrainerConfig.use_ema：维护 EMA；latent 模式仅对 DiT 生效
ema_decay: 0.9999  # EMA 衰减系数；越接近 1，历史权重保留越多
use_torch_compile: false  # TrainerConfig.use_torch_compile：编译模型；latent 模式仅编译 DiT
log_samples: true  # TrainerConfig.log_samples：保存 checkpoint 时记录生成图片
device: cuda  # 训练/采样设备，例如 cuda、cuda:0、cpu
seed: 42  # 入口设置的随机种子
wandb_mode: offline  # W&B 运行模式：online、offline 或 disabled
