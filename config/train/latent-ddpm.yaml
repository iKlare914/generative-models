# Entry: train/diffusion_train.py
# Learning baseline: 12-layer, width-768 DiT; frozen SDXL VAE. See config/README.md.
# Batch size remains unchanged; recheck GPU memory for the 12-layer, width-768 DiT.
# GPU memory use has not been measured for this configuration.
model_type: dit  # 模型架构；DiT 与 UNet 使用独立的参数集
use_latent: true  # 训练读取缓存 mean/std；false 仍是 DiT、改为在线编码图片
image_size: 256  # RGB 图像边长；DiT.image_size 由此除以 VAE 下采样倍数得到 (H, W)
vae_model_name_or_path: stabilityai/sdxl-vae  # LatentDiffusion.from_pretrained_vae 同名参数：VAE 仓库 ID 或本地目录
vae_slicing: true  # 调用 vae.enable_slicing()，按 batch 逐张编解码以节省显存
d_model: 768  # DiT.d_model：Transformer 隐藏维度
num_layers: 12  # DiT.num_layers：Transformer block 数量
patch_size: 2  # DiT.patch_size：latent 上的 patch 边长，不是 RGB 像素
d_time_emb: 512  # DiT.d_time_emb：时间步正弦嵌入维度，须为偶数
num_heads: 12  # DiT.num_heads：须整除 d_model；use_rope=true 时每个 head 的维度须为 4 的倍数
in_channel: null  # DiT.in_channel：null 从 VAE latent_channels 推导，SDXL VAE 为 4
grid_size_h: null  # DiT.grid_size_h：null 自动推导 latent 高 / patch_size；当前为 16
grid_size_w: null  # DiT.grid_size_w：null 自动推导 latent 宽 / patch_size；当前为 16
extra_feature: false  # DiT.extra_feature：CFG 入口启用文本 cross-attention，无条件入口关闭
d_feature: null  # DiT.d_feature：无条件模型不使用文本特征
use_rope: true  # DiT.use_rope：true 使用 2D RoPE；false 使用加性二维正弦位置编码
t_freq: 10000.0  # DiT.t_freq：时间步正弦嵌入的频率基数
pe_freq: 10000.0  # DiT.pe_freq：空间位置编码频率基数，也用作 RoPE theta
rope_cross_q: true  # DiT.rope_cross_q：是否给 cross-attention 的图像 Q 加 RoPE，仅 use_rope + extra_feature 时有效
rope_cross_k: false  # DiT.rope_cross_k：是否给文本 K 加 2D RoPE；开启需文本 token 数等于图像 patch 数，通常保持 false
use_adaln_zero: true  # DiT.use_adaln_zero：AdaLN 调制层零初始化；加载 checkpoint 后使用已训练权重
dataset_type: imagenet  # 入口选择的图像 loader：cifar10 或 imagenet
dataset: clane9/imagenet-100  # 传给 loader 的 repo_name：数据集仓库 ID
dataset_split: train  # 传给 loader 的 split；训练通常用 train
latent_cache_dir: ../../datasets  # LatentImagenetDataset.save_dir，须匹配预处理脚本 --save-dir
sample_posterior: true  # 对缓存 mean/std 采样；false 使用 mean，由 trainer 统一乘 scaling_factor
method: ddpm  # 训练算法选择：ddpm 预测噪声，fm 预测速度
epoches: 100  # TrainerConfig.epoches：目标总训练轮数（沿用现有代码的拼写）
batch_size: 128  # TrainerConfig / DataLoader.batch_size：每次更新的样本数
lr: 0.0001  # AdamW.lr：学习率
weight_decay: 0.0  # AdamW.weight_decay：权重衰减
num_timesteps: 1000  # make_beta_schedule.num_timesteps：DDPM 训练噪声调度长度，采样须一致
num_workers: 4  # DataLoader.num_workers：数据加载子进程数
cache_dir: ../../.cache/huggingface/datasets  # dataset.cache_dir：HF 数据缓存路径，相对本 YAML
save_dir: ../../checkpoints/imagenet100-latent-ddpm  # TrainerConfig.save_dir：checkpoint 目录，相对本 YAML
save_interval_epoch: 10  # TrainerConfig.save_interval_epoch：每隔多少轮保存并按需记录采样
resume: false  # TrainerConfig.resume：从 save_dir 中最新 checkpoint 继续训练
use_ema: true  # TrainerConfig.use_ema：维护 EMA；latent 模式仅对 DiT 生效
ema_decay: 0.9999  # EMA 衰减系数；越接近 1，历史权重保留越多
use_torch_compile: false  # TrainerConfig.use_torch_compile：编译模型；latent 模式仅编译 DiT
log_samples: true  # TrainerConfig.log_samples：保存 checkpoint 时记录生成图片
device: cuda  # 训练/采样设备，例如 cuda、cuda:0、cpu
seed: 42  # 入口设置的随机种子
wandb_mode: offline  # W&B 运行模式：online、offline 或 disabled
