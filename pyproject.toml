[project]
name = "generative_model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "iKlare", email = "iklare_hans@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.1",
    "wandb>=0.30.0",
]

[project.scripts]
 generative-model = "generative_model:main"

[project.optional-dependencies]
clip-cfg = [
    "matplotlib>=3.11.2",
    "transformers>=5.18.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
